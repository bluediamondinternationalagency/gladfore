# Build settings
[build]
  command = "npm run build"
  publish = "dist/public"

# Functions settings
[functions]
  directory = "netlify/functions"

# Node bundler settings for Netlify Functions
[functions.node_bundler]
  external_node_modules = ["express", "express-session", "bcryptjs"]

# Redirect all routes to index.html (for SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200